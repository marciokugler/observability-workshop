version: workshop-2026-06
currency: USD

# These are workshop examples collected from public pricing models on 2026-06-22.
# Always verify current prices and use your organization's approved internal rates
# before using this for production chargeback.
sources:
  openai_api_pricing: https://developers.openai.com/api/docs/pricing
  openai_api_pricing_marketing: https://openai.com/api/pricing/
  mistral_ai_pricing: https://mistral.ai/pricing/
  hugging_face_inference_providers_pricing: https://huggingface.co/docs/inference-providers/en/pricing
  hugging_face_inference_endpoints_pricing: https://huggingface.co/docs/inference-endpoints/en/pricing
  aws_ec2_on_demand_pricing: https://aws.amazon.com/ec2/pricing/on-demand/
  ollama_usage_metrics: https://docs.ollama.com/api/usage

token_models:
  # Public managed API examples. These are not local Ollama rates. They are here so
  # the workshop can compare derived local/on-prem economics with online model pricing.
  # Verify the rates on the provider page before teaching the lab.
  mistral-large-public-example:
    basis: public_token_rate
    input_usd_per_1m_tokens: 2.00
    output_usd_per_1m_tokens: 6.00
    source: mistral_ai_pricing

  openai-gpt-5.5-public-example:
    basis: public_token_rate
    input_usd_per_1m_tokens: 5.00
    cached_input_usd_per_1m_tokens: 0.50
    output_usd_per_1m_tokens: 30.00
    source: openai_api_pricing

  hugging-face-inference-provider:
    basis: provider_pass_through
    input_usd_per_1m_tokens: null
    output_usd_per_1m_tokens: null
    source: hugging_face_inference_providers_pricing
    note: Enter the selected provider model rate from the Hugging Face billing page.

  # Internal workshop model. This is not a vendor-published token price for NIM.
  # This local energy-only example is intentionally tiny. It is a lower bound for a
  # small Ollama model on a laptop, not a fully loaded production chargeback rate.
  internal-llama-3.2-1b-instruct:
    basis: observed_local_energy_only
    input_usd_per_1m_tokens: 0.0013
    output_usd_per_1m_tokens: 0.0158
    source: local_ollama_benchmark_example

gpu_hourly:
  hf-endpoint-t4-aws-x1:
    basis: dedicated_endpoint_hourly
    gpu_type: NVIDIA T4
    gpu_count: 1
    hourly_usd: 0.50
    source: hugging_face_inference_endpoints_pricing

  hf-endpoint-l4-aws-x1:
    basis: dedicated_endpoint_hourly
    gpu_type: NVIDIA L4
    gpu_count: 1
    hourly_usd: 0.80
    source: hugging_face_inference_endpoints_pricing

  hf-endpoint-a100-aws-x1:
    basis: dedicated_endpoint_hourly
    gpu_type: NVIDIA A100
    gpu_count: 1
    hourly_usd: 2.50
    source: hugging_face_inference_endpoints_pricing

  hf-endpoint-h100-aws-x1:
    basis: dedicated_endpoint_hourly
    gpu_type: NVIDIA H100
    gpu_count: 1
    hourly_usd: 4.50
    source: hugging_face_inference_endpoints_pricing

  hf-endpoint-h200-aws-x1:
    basis: dedicated_endpoint_hourly
    gpu_type: NVIDIA H200
    gpu_count: 1
    hourly_usd: 5.00
    source: hugging_face_inference_endpoints_pricing

local_hourly_cost_models:
  # Use this for a workshop where every student has different hardware.
  # It prices local inference as if the same work had run on a comparable public GPU.
  market_proxy:
    basis: public_gpu_hourly_proxy
    accelerator_hourly_usd: 0.80
    source_example: hf-endpoint-l4-aws-x1

  # Use this for a laptop or workstation where you know the purchase price.
  # Formula: ((purchase_price * gpu_allocation_ratio) - residual_value) / useful_life_hours
  hardware_amortization:
    basis: owned_hardware_amortization
    purchase_price_usd: 3000
    gpu_allocation_ratio: 0.35
    residual_value_usd: 300
    useful_life_hours: 6000
    derived_accelerator_hourly_usd: 0.125

  # Use this only to demonstrate that electricity alone understates true platform cost.
  energy_only:
    basis: local_power_draw
    load_power_watts: 30
    idle_power_watts: 6.88
    incremental_power_watts: 23.12
    electricity_usd_per_kwh: 0.1856
    derived_total_load_energy_hourly_usd: 0.005568
    derived_incremental_energy_hourly_usd: 0.004291

derived_local_token_rates:
  # Replace these values with output from scripts/benchmark_ollama.py.
  local-ollama-example:
    basis: observed_local_throughput
    model: llama3.2:1b
    cost_model: energy_only
    input_usd_per_1m_tokens: 0.0013
    output_usd_per_1m_tokens: 0.0158
    blended_usd_per_1m_tokens: 0.0172
    source: local_benchmark

derived_onprem_token_rates:
  # Example only. Replace monthly cost, billable GPU-hours, and measured throughput
  # with values from the customer's Cisco AI Pods or equivalent data-center platform.
  cisco-ai-pod-style-example:
    basis: owned_data_center_gpu_pool
    monthly_platform_cost_usd: 48000
    gpu_count: 16
    hours_per_month: 730
    usable_utilization_target: 0.70
    derived_gpu_hour_rate_usd: 5.87
    input_usd_per_1m_tokens: null
    output_usd_per_1m_tokens: null
    source: customer_internal_cost_pool

overhead:
  shared_platform_overhead_percent: 15
  include_observability_pipeline: true
  include_vector_database: true
  include_storage_and_network: true
