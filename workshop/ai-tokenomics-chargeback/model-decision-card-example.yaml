version: workshop-2026-06
card_type: model_decision_card

# A model decision card combines three things:
# 1. model-card facts: what the model is and what it is intended to do
# 2. ranking/evaluation snapshots: how it scored for a specific task at a point in time
# 3. rate-card economics: what it costs in this environment
#
# Do not treat leaderboard rank as permanent truth. Store the source, metric, task, and
# capture date so the decision can be reviewed later.

model:
  name: llama3.2:1b
  public_model_card: https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct
  local_runtime: https://ollama.com/library/llama3.2
  developer: Meta
  parameter_size: 1.2B
  license: Llama 3.2 Community License
  intended_workshop_use:
    - local summarization
    - lightweight chat
    - tokenomics and chargeback demonstration
  out_of_scope:
    - production legal advice
    - production medical advice
    - high-stakes autonomous decisions

ranking_snapshots:
  # Fill these during the workshop from the live public leaderboard pages.
  # Use task-specific ranking when possible. A general chat ranking is not enough for
  # coding, support summarization, regulated workflows, or retrieval quality.
  - source: lmarena_text_arena
    url: https://arena.ai/leaderboard/text
    captured_at: null
    task: general_text_chat
    metric_name: arena_score
    model_name_on_leaderboard: null
    rank: null
    score: null
    notes: Crowdsourced preference ranking. Useful for broad user preference, not a substitute for customer-specific evaluation.

  - source: hugging_face_open_llm_leaderboard
    url: https://huggingface.co/open-llm-leaderboard
    captured_at: null
    task: open_model_benchmark_suite
    metric_name: leaderboard_average
    model_name_on_leaderboard: null
    rank: null
    score: null
    notes: Useful for open-weight model comparison when the model is represented in the leaderboard data.

  - source: stanford_helm
    url: https://crfm.stanford.edu/helm/
    captured_at: null
    task: scenario_specific_capability_or_safety
    metric_name: scenario_metric
    model_name_on_leaderboard: null
    rank: null
    score: null
    notes: Prefer HELM when the decision needs scenario-specific transparency, safety, or robustness context.

rate_card_snapshots:
  local_energy_only:
    source: local_ollama_benchmark
    input_usd_per_1m_tokens: 0.0013
    output_usd_per_1m_tokens: 0.0158
    notes: Lower-bound laptop energy cost. Not a fully loaded production chargeback rate.

  managed_online_example:
    source: public_provider_pricing
    provider: Mistral
    model: mistral-large-public-example
    pricing_url: https://mistral.ai/pricing/
    input_usd_per_1m_tokens: 2.00
    output_usd_per_1m_tokens: 6.00
    notes: Verify current pricing before teaching or using in a customer decision.

  onprem_gpu_pool_example:
    source: customer_internal_cost_pool
    platform: cisco_ai_pods_style
    gpu_hour_rate_usd: 5.87
    input_usd_per_1m_tokens: null
    output_usd_per_1m_tokens: null
    notes: Fill from the customer's monthly platform cost, billable GPU-hours, and measured token throughput.

observed_workload_fit:
  benchmark_prompt_tokens: null
  benchmark_completion_tokens: null
  latency_p50_ms: null
  latency_p95_ms: null
  accepted_outcome_rate: null
  failure_rate: null
  quality_notes: null

placement_decision:
  price_only_winner: null
  recommended_placement: null
  rationale:
    - Compare price using per-million input and output token rates.
    - Compare quality using a task-specific leaderboard or internal evaluation.
    - Compare operations using latency, reliability, data governance, and support requirements.
